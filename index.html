  const [f, setF] = useState({ nome: "", contato: "", tipo: "industrial", origem: "" });
  const add = () => {
    if (!f.nome.trim()) return;
    up({ clientes: [...d.clientes, { id: uid(), ...f }] });
    setF({ nome: "", contato: "", tipo: "industrial", origem: "" });
  };
  const porOrigem = d.clientes.filter((x) => /indica/i.test(x.origem || "")).length;
  return (
    <div className="dl-sec">
      <h2>Clientes</h2>
      <p className="dl-note">
        Anote de onde veio cada um. {d.clientes.length > 0 && porOrigem > 0
          ? Math.round((porOrigem / d.clientes.length) * 100) + "% vieram de indicação — esse é o seu ativo local mais valioso."
          : "Se a maioria vier de indicação, esse é o seu ativo mais valioso e ele é local."}
      </p>
      <div className="dl-form">
        <div className="dl-f"><input className="dl-in" placeholder="Nome" value={f.nome} onChange={(e) => setF({ ...f, nome: e.target.value })} /></div>
        <div className="dl-f">
          <input className="dl-in" placeholder="Contato" value={f.contato} onChange={(e) => setF({ ...f, contato: e.target.value })} />
          <select className="dl-in" style={{ maxWidth: 130 }} value={f.tipo} onChange={(e) => setF({ ...f, tipo: e.target.value })}>
            <option value="industrial">industrial</option><option value="predial">predial</option>
            <option value="comercial">comercial</option><option value="residencial">residencial</option>
          </select>
        </div>
        <div className="dl-f"><input className="dl-in" placeholder="Como chegou até você" value={f.origem} onChange={(e) => setF({ ...f, origem: e.target.value })} /></div>
        <button className="dl-btn" onClick={add}>Adicionar cliente</button>
      </div>
      {d.clientes.length === 0 && <div className="dl-empty">Nenhum cliente cadastrado ainda.</div>}
      {d.clientes.map((x) => (
        <div className="dl-row" key={x.id}>
          <div className="dl-row-main">
            <div className="dl-row-t">{x.nome}</div>
            <div className="dl-row-s">{x.tipo}{x.contato ? " · " + x.contato : ""}{x.origem ? " · " + x.origem : ""}</div>
          </div>
          <button className="dl-x" onClick={() => up({ clientes: d.clientes.filter((y) => y.id !== x.id) })}>×</button>
        </div>
      ))}
    </div>
  );
}

/* =============================== BACKUP =============================== */
function Backup({ d, up }) {
  const [json, setJson] = useState("");
  const [imp, setImp] = useState("");
  const [msg, setMsg] = useState("");
  const [teste, setTeste] = useState("");
  const [confirmar, setConfirmar] = useState(false);

  const registros = d.custos.length + d.contratos.length + d.obras.length +
    d.lancamentos.length + d.ativos.length + d.clientes.length + d.metas.length;

  const gerar = () => {
    const texto = JSON.stringify({ ...d, exportadoEm: hoje() }, null, 2);
    setJson(texto);
    up({ ultimoBackup: hoje() });
    return texto;
  };

  const baixar = () => {
    const texto = gerar();
    try {
      const blob = new Blob([texto], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "dialetica-backup-" + hoje() + ".json";
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 3000);
      setMsg("Arquivo gerado. Se o download não aparecer no celular, use o texto abaixo.");
    } catch (e) {
      setMsg("O navegador bloqueou o download. Copie o texto abaixo e guarde onde preferir.");
    }
  };

  const copiar = async () => {
    const texto = gerar();
    try {
      await navigator.clipboard.writeText(texto);
      setMsg("Copiado. Cole num bloco de notas, no seu e-mail ou no Drive.");
    } catch (e) {
      setMsg("Não consegui copiar sozinho. Selecione o texto abaixo e copie na mão.");
    }
  };

  const restaurar = () => {
    try {
      const obj = JSON.parse(imp);
      if (!obj || typeof obj !== "object" || !Array.isArray(obj.custos)) throw new Error("formato");
      up({ ...VAZIO, ...obj });
      setImp("");
      setConfirmar(false);
      setMsg("Backup restaurado. Confira as abas para garantir que está tudo aí.");
    } catch (e) {
      setMsg("Esse texto não é um backup válido. Cole o conteúdo inteiro do arquivo, das chaves de abertura às de fechamento.");
    }
  };

  const testar = async () => {
    setTeste("testando…");
    try {
      const marca = String(Date.now());
      const onde = await loja.set("dialetica:teste", marca);
      const r = await loja.get("dialetica:teste");
      setTeste(r === marca
        ? "Salvamento funcionando, guardando no " + onde + ". Pode lançar seus dados."
        : "O painel gravou mas não conseguiu ler de volta. Recarregue e teste de novo.");
    } catch (e) {
      setTeste("Salvamento indisponível aqui. Abra o painel pelo link publicado, não pela pré-visualização.");
    }
  };

  return (
    <div className="dl-sec">
      <h2>Backup</h2>
      <p className="dl-note">Seus dados ficam guardados na sua conta do Claude. Uma cópia sua, fora dele, é o que garante que nada se perca.</p>

      <div className="dl-grid" style={{ marginTop: 0, marginBottom: 12 }}>
        <div className="dl-stat">
          <p className="dl-stat-label">Registros guardados</p>
          <div className="dl-stat-val">{registros}</div>
        </div>
        <div className="dl-stat">
          <p className="dl-stat-label">Último backup</p>
          <div className="dl-stat-val" style={{ color: d.ultimoBackup ? undefined : "var(--fase)" }}>
            {d.ultimoBackup ? br(d.ultimoBackup) : "nunca"}
          </div>
        </div>
      </div>

      <h3 style={{ marginBottom: 8 }}>Salvamento automático</h3>
      <div className="dl-form">
        <button className="dl-btn-2" onClick={testar}>Testar salvamento</button>
        {teste && <p className="dl-row-s" style={{ marginTop: 9 }}>{teste}</p>}
      </div>

      <h3 style={{ marginBottom: 8 }}>Guardar uma cópia</h3>
      <div className="dl-form">
        <div className="dl-f">
          <button className="dl-btn" onClick={baixar}>Baixar arquivo</button>
          <button className="dl-btn-2" onClick={copiar}>Copiar texto</button>
        </div>
        {msg && <p className="dl-row-s" style={{ marginBottom: 8 }}>{msg}</p>}
        {json && <textarea className="dl-in dl-ta" style={{ minHeight: 130, fontSize: 12 }} readOnly value={json} onFocus={(e) => e.target.select()} />}
      </div>

      <h3 style={{ marginBottom: 8 }}>Restaurar de um backup</h3>
      <div className="dl-info">
        Restaurar apaga o que está no painel agora e coloca o conteúdo do backup no lugar. Só use se perdeu dados ou está começando num painel novo.
      </div>
      <div className="dl-form">
        <textarea className="dl-in dl-ta" placeholder="Cole aqui o conteúdo do arquivo de backup" value={imp} onChange={(e) => { setImp(e.target.value); setConfirmar(false); }} />
        {!confirmar
          ? <button className="dl-btn-2" onClick={() => imp.trim() && setConfirmar(true)}>Restaurar</button>
          : <div className="dl-f" style={{ marginTop: 4, marginBottom: 0 }}>
              <button className="dl-btn" onClick={restaurar}>Confirmar e substituir tudo</button>
              <button className="dl-btn-2" onClick={() => setConfirmar(false)}>Cancelar</button>
            </div>}
      </div>

      <div className="dl-info" style={{ marginTop: 14 }}>
        <h3>Rotina sugerida</h3>
        <p>Todo dia 1º, quando você for lançar o lucro do mês na aba Metas, faça o backup logo em seguida. São dois toques e resolve.</p>
      </div>
    </div>
  );
}

/* ================================ VIDA ================================ */
function Vida({ d, up, c }) {
  const [sub, setSub] = useState("custo");
  const [f, setF] = useState({ nome: "", valor: "", tipo: "imovel" });

  const listaDe = { custo: "custoVida", renda: "rendas", patrimonio: "patrimonio" }[sub];
  const add = () => {
    if (!f.nome.trim()) return;
    up({ [listaDe]: [...d[listaDe], { id: uid(), nome: f.nome.trim(), valor: f.valor, tipo: f.tipo }] });
    setF({ nome: "", valor: "", tipo: "imovel" });
  };
  const edit = (id, v) => up({ [listaDe]: d[listaDe].map((x) => (x.id === id ? { ...x, valor: v } : x)) });
  const del = (id) => up({ [listaDe]: d[listaDe].filter((x) => x.id !== id) });

  const faltam = Math.max(0, c.custoVida - c.rendaPassiva);

  return (
    <div className="dl-sec">
      <h2>Vida</h2>
      <p className="dl-note">
        A empresa é a máquina. Aqui é o que ela está construindo. O número que importa é quanto da sua vida já se paga sem você trabalhar.
      </p>

      <div className="dl-grid" style={{ marginTop: 0, marginBottom: 12 }}>
        <div className="dl-stat">
          <p className="dl-stat-label">Independência</p>
          <div className="dl-stat-val" style={{ color: c.independencia >= 100 ? "var(--terra)" : "var(--neutro)" }}>{Math.round(c.independencia)}%</div>
        </div>
        <div className="dl-stat">
          <p className="dl-stat-label">Falta de renda passiva</p>
          <div className="dl-stat-val">{brl(faltam)}</div>
        </div>
        <div className="dl-stat">
          <p className="dl-stat-label">Renda dos ativos</p>
          <div className="dl-stat-val">{brl(c.rendaPassiva)}</div>
        </div>
        <div className="dl-stat">
          <p className="dl-stat-label">Patrimônio</p>
          <div className="dl-stat-val">{brl(c.patrimonio)}</div>
        </div>
      </div>

      <div className="dl-sub2">
        {[["custo", "Custo de vida"], ["renda", "Outras rendas"], ["patrimonio", "Patrimônio"]].map(([k, r]) => (
          <button key={k} className={sub === k ? "on" : ""} onClick={() => setSub(k)}>{r}</button>
        ))}
      </div>

      {sub === "custo" && (
        <p className="dl-note">O que a sua vida custa por mês, fora da empresa: moradia, comida, escola, saúde, transporte, lazer. É a meta que a renda passiva precisa alcançar.</p>
      )}
      {sub === "renda" && (
        <p className="dl-note">Renda que não vem do seu trabalho nem da empresa: aluguel, aplicação, sociedade. A renda dos ativos já entra sozinha, não repita aqui.</p>
      )}
      {sub === "patrimonio" && (
        <p className="dl-note">O que você tem hoje. A reserva e o fundo de ativos já somam sozinhos, cadastre só o resto.</p>
      )}

      <div className="dl-form">
        <div className="dl-f">
          <input className="dl-in" placeholder={sub === "custo" ? "Item" : sub === "renda" ? "Fonte" : "Bem"} value={f.nome} onChange={(e) => setF({ ...f, nome: e.target.value })} />
          <input className="dl-in" style={{ maxWidth: 118 }} inputMode="decimal" placeholder="R$" value={f.valor} onChange={(e) => setF({ ...f, valor: e.target.value })} />
        </div>
        {sub === "patrimonio" && (
          <div className="dl-f">
            <select className="dl-in" value={f.tipo} onChange={(e) => setF({ ...f, tipo: e.target.value })}>
              <option value="imovel">imóvel</option>
              <option value="terreno">terreno</option>
              <option value="veiculo">veículo</option>
              <option value="equipamento">equipamento</option>
              <option value="aplicacao">aplicação</option>
              <option value="outro">outro</option>
            </select>
          </div>
        )}
        <button className="dl-btn" onClick={add}>Adicionar</button>
      </div>

      {d[listaDe].length === 0 && (
        <div className="dl-empty">
          {sub === "custo" ? "Comece pela moradia e pela alimentação." : sub === "renda" ? "Nenhuma renda fora do seu trabalho ainda. É exatamente isso que o plano quer mudar." : "Cadastre o terreno da usina, o veículo e o que mais for seu."}
        </div>
      )}
      {d[listaDe].map((x) => (
        <div className="dl-row" key={x.id}>
          <div className="dl-row-main">
            <div className="dl-row-t">{x.nome}</div>
            {sub === "patrimonio" && <div className="dl-row-s">{x.tipo}</div>}
          </div>
          <input className="dl-in" style={{ maxWidth: 112, textAlign: "right" }} inputMode="decimal" value={x.valor} placeholder="R$" onChange={(e) => edit(x.id, e.target.value)} />
          <button className="dl-x" onClick={() => del(x.id)}>×</button>
        </div>
      ))}
      <div className="dl-total">
        <span>{sub === "custo" ? "Custo de vida mensal" : sub === "renda" ? "Outras rendas" : "Bens cadastrados"}</span>
        <b>{brl(d[listaDe].reduce((s2, x) => s2 + num(x.valor), 0))}</b>
      </div>

      {c.custoVida > 0 && c.rendaPassiva < c.custoVida && (
        <div className="dl-info" style={{ marginTop: 16 }}>
          <h3>O alvo</h3>
          <p>
            Para sua vida se pagar sozinha faltam {brl(faltam)} de renda passiva por mês.
            {c.reservaMeses < 6
              ? " O caminho ainda passa por encher a reserva antes de comprar o primeiro ativo."
              : " Você já pode dimensionar o próximo ativo por esse número, em vez de chutar o porte."}
          </p>
        </div>
      )}
    </div>
  );
}

/* =========================== FECHAR O MÊS =========================== */
function CaixaFechar({ d, up, c }) {
  const ym = ymHoje();
  const feito = d.fechamentos[ym] || {};
  const doMes = d.lancamentos.filter((l) => ((l.status === "previsto" ? l.vencimento : l.data) || "").slice(0, 7) === ym);
  const ent = doMes.filter((l) => l.tipo === "e" && l.status !== "previsto").reduce((s, l) => s + num(l.valor), 0);
  const sai = doMes.filter((l) => l.tipo === "s" && l.status !== "previsto").reduce((s, l) => s + num(l.valor), 0);
  const resultado = ent - sai;
  const marcar = (k) => up({ fechamentos: { ...d.fechamentos, [ym]: { ...feito, [k]: true } } });

  const lancarFixos = () => {
    const novos = d.custos.filter((x) => x.tipo !== "variavel" && num(x.valor) > 0).map((x) => ({
      id: uid(), data: ym + "-01", vencimento: ym + "-10", desc: x.nome, valor: x.valor,
      tipo: "s", forma: "Pix", status: "previsto", categoria: "fixo" }));
    if (!novos.length) return;
    up({ lancamentos: [...novos, ...d.lancamentos], fechamentos: { ...d.fechamentos, [ym]: { ...feito, fixos: true } } });
  };

  const faturarContratos = () => {
    const ativos = d.contratos.filter((x) => x.ativo !== false && num(x.valor) > 0);
    const novos = ativos.map((x) => ({
      id: uid(), data: ym + "-01", vencimento: ym + "-10", desc: "Manutenção · " + x.cliente, valor: x.valor,
      tipo: "e", forma: "Pix", status: "previsto", categoria: "manutencao", contratoId: x.id }));
    if (!novos.length) return;
    up({ lancamentos: [...novos, ...d.lancamentos], fechamentos: { ...d.fechamentos, [ym]: { ...feito, contratos: true } } });
  };

  const distribuir = () => {
    if (resultado <= 0) return;
    const p = d.potes, bloqueado = c.reservaMeses < 6;
    up({
      reserva: String(num(d.reserva) + resultado * ((bloqueado ? p.reserva + p.ativos : p.reserva) / 100)),
      giro: String(num(d.giro) + resultado * (p.giro / 100)),
      fundoAtivos: String(num(d.fundoAtivos) + (bloqueado ? 0 : resultado * (p.ativos / 100))),
      fechamentos: { ...d.fechamentos, [ym]: { ...feito, lucro: true } },
    });
  };

  return (
    <>
      <p className="dl-note">Três toques por mês e o painel inteiro fica em dia. Faça no começo do mês.</p>

      <div className="dl-grid" style={{ marginTop: 0, marginBottom: 14 }}>
        <div className="dl-stat"><p className="dl-stat-label">Entrou em {mesLabel(ym)}</p><div className="dl-stat-val" style={{ color: "var(--terra)" }}>{brl(ent)}</div></div>
        <div className="dl-stat"><p className="dl-stat-label">Saiu em {mesLabel(ym)}</p><div className="dl-stat-val" style={{ color: "var(--fase)" }}>{brl(sai)}</div></div>
      </div>

      <div className="dl-row" style={{ display: "block" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 10 }}>
          <div className="dl-row-main">
            <div className="dl-row-t">1 · Lançar as contas fixas</div>
            <div className="dl-row-s">Gera uma conta a pagar para cada item do custo fixo, vencendo dia 10.</div>
          </div>
          {feito.fixos ? <span className="dl-pill dl-pill-ok">feito</span>
            : <button className="dl-btn" onClick={lancarFixos}>Lançar</button>}
        </div>
      </div>

      <div className="dl-row" style={{ display: "block" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 10 }}>
          <div className="dl-row-main">
            <div className="dl-row-t">2 · Faturar os contratos</div>
            <div className="dl-row-s">Gera uma cobrança para cada contrato de manutenção ativo.</div>
          </div>
          {feito.contratos ? <span className="dl-pill dl-pill-ok">feito</span>
            : <button className="dl-btn" onClick={faturarContratos}>Faturar</button>}
        </div>
      </div>

      <div className="dl-row" style={{ display: "block" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 10 }}>
          <div className="dl-row-main">
            <div className="dl-row-t">3 · Apurar o lucro</div>
            <div className="dl-row-s">
              {resultado > 0 ? "Resultado de " + brl(resultado) + ", dividido nos três potes." : "O mês ainda não fechou positivo."}
            </div>
          </div>
          {feito.lucro ? <span className="dl-pill dl-pill-ok">feito</span>
            : <button className="dl-btn" disabled={resultado <= 0} style={{ opacity: resultado > 0 ? 1 : .4 }} onClick={distribuir}>Distribuir</button>}
        </div>
      </div>

      <div className="dl-info" style={{ marginTop: 14 }}>
        <h3>Depois disso</h3>
        <p>As contas a pagar e as cobranças ficam na aba “A receber e a pagar”. Conforme o dinheiro entra e sai de verdade, você dá baixa no ✓ e o caixa se ajusta sozinho.</p>
      </div>
    </>
  );
}


ReactDOM.createRoot(document.getElementById("raiz")).render(<PainelDialetica />);
