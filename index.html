const { useState, useEffect, useMemo, useRef } = React;

/* ================================================================
   Painel de Comando — Dialética
   Metáfora: quadro de distribuição. Cada fase é um disjuntor que
   só fecha quando as condições dela são atendidas.
   ================================================================ */

const STORE_KEY = "dialetica:painel";

/* Armazenamento adaptativo: usa a nuvem do Claude quando publicado,
   e o próprio aparelho quando aberto como arquivo solto no celular. */
const loja = {
  async get(k) {
    try { return window.localStorage.getItem(k); } catch (e) { return null; }
  },
  async set(k, v) {
    window.localStorage.setItem(k, v);
    return "aparelho";
  },
};

const CSS = `

/* ------------------------------ utils ------------------------------ */
const brl = (n) => (isFinite(n) ? n : 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL", maximumFractionDigits: 0 });
const num = (v) => { const n = parseFloat(String(v ?? "").replace(/\./g, "").replace(",", ".")); return isFinite(n) ? n : 0; };
const uid = () => Math.random().toString(36).slice(2, 9);
const hoje = () => new Date().toISOString().slice(0, 10);
const br = (d) => (d ? d.split("-").reverse().join("/") : "—");
const MES = ["jan", "fev", "mar", "abr", "mai", "jun", "jul", "ago", "set", "out", "nov", "dez"];
const mesLabel = (ym) => MES[+ym.slice(5, 7) - 1] + "/" + ym.slice(2, 4);
const addMes = (ym, k) => { const [a, m] = ym.split("-").map(Number); const dt = new Date(a, m - 1 + k, 1); return dt.toISOString().slice(0, 7); };
const ymHoje = () => hoje().slice(0, 7);
const dias = (a, b) => Math.round((new Date(b) - new Date(a)) / 86400000);

const FORMAS = ["Pix", "Dinheiro", "Transferência", "Boleto", "Cartão", "Cheque"];

const SUG_FIXO = ["Pró-labore", "Contador", "Conta de celular", "Internet", "Combustível", "Manutenção do veículo",
  "Seguro do veículo", "IPVA e licenciamento", "Aluguel", "Energia do escritório", "Sistema / ERP",
  "Ferramentas e equipamentos", "EPI", "Anuidade CREA", "Encarregado", "Administrativo", "Impostos fixos", "Marketing"];
const SUG_VAR = ["Material elétrico", "Empreitada de mão de obra", "Diária de ajudante", "Frete e entrega",
  "Locação de equipamento", "Combustível de obra", "Alimentação em obra", "Hospedagem", "ART por obra",
  "Comissão de venda", "ISS sobre serviço", "Descarte de resíduo"];

const VAZIO = {
  custos: [], contratos: [], obras: [], lancamentos: [], ativos: [], clientes: [], metas: [],
  saldoInicial: "", reserva: "", giro: "", fundoAtivos: "",
  potes: { reserva: 50, giro: 30, ativos: 20 },
  marcos: { margens: false, ciclo: "", operacao60: false, lucro6: false, primeiroAtivo6: false },
  custoVida: [], rendas: [], patrimonio: [], fechamentos: {},
  ultimoBackup: "",
  versao: 2,
};

/* Converte dados antigos (gastos e movimentos soltos) para lançamentos únicos,
   para que obra, ativo e caixa passem a olhar para a mesma fonte de dinheiro. */
function migrar(s) {
  if (s.versao === 2) return s;
  const extras = [];
  const obras = (s.obras || []).map((o) => {
    (o.gastos || []).forEach((g) => extras.push({
      id: uid(), data: g.data, desc: g.descricao || g.cat, valor: g.valor, tipo: "s", forma: "Pix",
      status: "pago", categoria: g.cat === "maodeobra" ? "maodeobra" : g.cat === "material" ? "material" : "outra", obraId: o.id }));
    return { ...o, gastos: [] };
  });
  const ativos = (s.ativos || []).map((a) => {
    (a.aportes || []).forEach((x) => extras.push({
      id: uid(), data: x.data, desc: (x.desc || "aporte") + " · " + a.nome, valor: x.valor, tipo: "s",
      forma: "Pix", status: "pago", categoria: "ativo", ativoId: a.id, aporte: true }));
    (a.movimentos || []).forEach((x) => extras.push({
      id: uid(), data: x.data, desc: x.desc || a.nome, valor: x.valor, tipo: x.tipo,
      forma: "Pix", status: "pago", categoria: "ativo", ativoId: a.id }));
    return { ...a, aportes: [], movimentos: [] };
  });
  return { ...s, obras, ativos, lancamentos: [...extras, ...(s.lancamentos || [])], versao: 2 };
}

/* ================================ APP ================================ */
function PainelDialetica() {
  const [d, setD] = useState(VAZIO);
  const [aba, setAba] = useState("painel");
  const [det, setDet] = useState(null); // {tipo,id}
  const [carregando, setCarregando] = useState(true);
  const [status, setStatus] = useState("");
  const primeira = useRef(true);

  useEffect(() => {
    (async () => {
      try { const r = await loja.get(STORE_KEY); if (r) setD({ ...VAZIO, ...migrar(JSON.parse(r)) }); }
      catch (e) { /* primeira abertura */ }
      setCarregando(false);
    })();
  }, []);

  useEffect(() => {
    if (carregando) return;
    if (primeira.current) { primeira.current = false; return; }
    const t = setTimeout(async () => {
      try {
        const onde = await loja.set(STORE_KEY, JSON.stringify(d));
        setStatus("salvo no " + onde + " · " + new Date().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" }));
      } catch (e) { setStatus("não consegui salvar"); }
    }, 700);
    return () => clearTimeout(t);
  }, [d, carregando]);

  const up = (patch) => setD((p) => ({ ...p, ...patch }));
  const upItem = (col, id, patch) => up({ [col]: d[col].map((x) => (x.id === id ? { ...x, ...patch } : x)) });

  /* ---------------------------- cálculos ---------------------------- */
  const c = useMemo(() => {
    const fixos = d.custos.filter((x) => x.tipo !== "variavel");
    const variaveis = d.custos.filter((x) => x.tipo === "variavel");
    const custoFixo = fixos.reduce((s, x) => s + num(x.valor), 0);
    const varMensal = variaveis.filter((x) => x.unidade === "mes").reduce((s, x) => s + num(x.valor), 0);
    const recorrente = d.contratos.filter((x) => x.ativo !== false).reduce((s, x) => s + num(x.valor), 0);
    const cobertura = custoFixo > 0 ? (recorrente / custoFixo) * 100 : 0;

    const pagos = d.lancamentos.filter((l) => l.status !== "previsto");
    const entradas = pagos.filter((l) => l.tipo === "e").reduce((s, l) => s + num(l.valor), 0);
    const saidas = pagos.filter((l) => l.tipo === "s").reduce((s, l) => s + num(l.valor), 0);
    const caixa = num(d.saldoInicial) + entradas - saidas;

    const prev = d.lancamentos.filter((l) => l.status === "previsto");
    const aReceber = prev.filter((l) => l.tipo === "e").reduce((s, l) => s + num(l.valor), 0);
    const aPagar = prev.filter((l) => l.tipo === "s").reduce((s, l) => s + num(l.valor), 0);
    const atrasados = prev.filter((l) => l.tipo === "e" && l.vencimento && l.vencimento < hoje());

    const reserva = num(d.reserva);
    const reservaMeses = custoFixo > 0 ? reserva / custoFixo : 0;

    const obraCalc = {};
    d.obras.forEach((o) => {
      const lanc = d.lancamentos.filter((l) => l.obraId === o.id);
      const med = (o.medicoes || []).reduce((s, m) => s + num(m.valor), 0);
      const receb = lanc.filter((l) => l.tipo === "e" && l.status !== "previsto").reduce((s, l) => s + num(l.valor), 0);
      const gasto = lanc.filter((l) => l.tipo === "s").reduce((s, l) => s + num(l.valor), 0);
      const etapas = o.etapas || [];
      obraCalc[o.id] = {
        med, receb, gasto, lanc,
        margem: num(o.contrato) - (gasto || num(o.custoPrevisto)),
        aReceber: Math.max(0, med - receb),
        naoMedido: Math.max(0, num(o.contrato) - med),
        progresso: etapas.length ? (etapas.filter((e) => e.ok).length / etapas.length) * 100 : 0,
      };
    });
    const margemObras = d.obras.reduce((s, o) => s + obraCalc[o.id].margem, 0);
    const obraAReceber = d.obras.filter((o) => o.status !== "fechada").reduce((s, o) => s + obraCalc[o.id].aReceber, 0);

    const ativoCalc = {};
    d.ativos.forEach((a) => {
      const lanc = d.lancamentos.filter((l) => l.ativoId === a.id);
      const ap = lanc.filter((l) => l.aporte).reduce((s, x) => s + num(x.valor), 0);
      const rec = lanc.filter((l) => l.tipo === "e").reduce((s, x) => s + num(x.valor), 0);
      const des = lanc.filter((l) => l.tipo === "s" && !l.aporte).reduce((s, x) => s + num(x.valor), 0);
      const meses = new Set(lanc.filter((l) => !l.aporte).map((x) => (x.data || hoje()).slice(0, 7))).size || 0;
      const liquidoMes = meses ? (rec - des) / meses : num(a.retorno);
      ativoCalc[a.id] = { ap, rec, des, liquidoMes, lanc, payback: liquidoMes > 0 ? ap / liquidoMes : 0 };
    });

    const emExecucao = d.ativos.filter((a) => a.status === "execucao").length;
    const operando = d.ativos.filter((a) => a.status === "operando");
    const rendaAtivos = operando.reduce((s, a) => s + Math.max(0, ativoCalc[a.id].liquidoMes), 0);

    const custoVida = d.custoVida.reduce((s2, x) => s2 + num(x.valor), 0);
    const outrasRendas = d.rendas.reduce((s2, x) => s2 + num(x.valor), 0);
    const rendaPassiva = rendaAtivos + outrasRendas;
    const independencia = custoVida > 0 ? (rendaPassiva / custoVida) * 100 : 0;
    const patrimonio = d.patrimonio.reduce((s2, x) => s2 + num(x.valor), 0) + reserva + num(d.fundoAtivos);

    return { custoVida, outrasRendas, rendaPassiva, independencia, patrimonio,
      custoFixo, varMensal, recorrente, cobertura, caixa, aReceber, aPagar, atrasados, reserva, reservaMeses,
      obraCalc, margemObras, obraAReceber, ativoCalc, emExecucao, operando: operando.length, rendaAtivos };
  }, [d]);

  const valorMeta = (m) => {
    if (m.fonte === "recorrente") return c.recorrente;
    if (m.fonte === "reserva") return c.reserva;
    if (m.fonte === "caixa") return c.caixa;
    if (m.fonte === "ativos") return c.rendaAtivos;
    return num(m.atual);
  };
  const metasAbertas = d.metas.filter((m) => valorMeta(m) < num(m.alvo));
  const proximaMeta = metasAbertas.slice().sort((a, b) => (num(a.alvo) - valorMeta(a)) - (num(b.alvo) - valorMeta(b)))[0];

  /* ------------------------------ fases ------------------------------ */
  const fases = useMemo(() => {
    const f = [
      { n: "Fase 0", nome: "Saber os números", cond: [
        { t: "Custo fixo mensal levantado item a item", ok: c.custoFixo > 0 },
        { t: "Custos variáveis mapeados", ok: d.custos.some((x) => x.tipo === "variavel") },
        { t: "Margem apurada por tipo de obra", ok: d.marcos.margens },
        { t: "Ciclo de caixa medido em dias", ok: num(d.marcos.ciclo) > 0 } ] },
      { n: "Fase 1", nome: "Previsibilidade", cond: [
        { t: "Contratos de manutenção cobrindo 100% do custo fixo", ok: c.cobertura >= 100 && c.custoFixo > 0 } ] },
      { n: "Fase 2", nome: "Sair do operacional", cond: [
        { t: "Reserva de 3 meses de custo fixo", ok: c.reservaMeses >= 3 },
        { t: "Encarregado no lugar antes de qualquer ajudante", ok: d.custos.some((x) => /encarreg/i.test(x.nome || "")) } ] },
      { n: "Fase 3", nome: "Subir o ticket", cond: [
        { t: "Operação rodou 60 dias seguidos sem você no canteiro", ok: d.marcos.operacao60 } ] },
      { n: "Fase 4", nome: "Primeiro ativo", cond: [
        { t: "Reserva de 6 meses de custo fixo", ok: c.reservaMeses >= 6 },
        { t: "Lucro consistente por 6 meses seguidos", ok: d.marcos.lucro6 } ] },
      { n: "Fase 5", nome: "Segundo ativo", cond: [
        { t: "Primeiro ativo pagando as próprias contas há 6 meses", ok: d.marcos.primeiroAtivo6 } ] },
    ];
    let ant = true;
    return f.map((x) => {
      const propria = x.cond.every((k) => k.ok);
      const fechada = ant && propria, atual = ant && !propria;
      ant = fechada;
      return { ...x, fechada, atual };
    });
  }, [d, c]);
  const faseAtual = fases.find((f) => f.atual) || fases[fases.length - 1];

  const travas = [];
  if (c.emExecucao > 1) travas.push("Você tem " + c.emExecucao + " ativos em execução ao mesmo tempo. A regra é um por vez.");
  if (num(d.fundoAtivos) > 0 && c.reservaMeses < 6) travas.push("Existe dinheiro no fundo de ativos com a reserva abaixo de 6 meses. Enquanto o pote 1 não enche, o pote 3 recebe zero.");
  if (c.custoFixo > 0 && c.cobertura < 100 && d.custos.some((x) => /encarreg|ajudant|eletricist|salári|folha|administrativ/i.test(x.nome || "")))
    travas.push("Já existe folha no custo fixo sem o recorrente cobrir 100% dele. É o erro que mais quebra empresa de obra.");
  if (c.atrasados.length) travas.push(c.atrasados.length + " cobrança(s) vencida(s) sem receber, somando " + brl(c.atrasados.reduce((s, l) => s + num(l.valor), 0)) + ". Vá na aba Caixa.");

  if (carregando) return <div style={{ padding: 24, fontFamily: "system-ui", color: "#6D7278" }}>Abrindo o painel…</div>;

  const abas = [["painel", "Painel"], ["custos", "Custos"], ["contratos", "Recorrente"], ["obras", "Obras"],
    ["caixa", "Caixa"], ["metas", "Metas"], ["ativos", "Ativos"], ["vida", "Vida"], ["clientes", "Clientes"], ["backup", "Backup"]];

  const irPara = (tipo, id) => setDet({ tipo, id });
  const voltar = () => setDet(null);

  let conteudo;
  if (det?.tipo === "obra") conteudo = <ObraDetalhe d={d} up={up} upItem={upItem} c={c} id={det.id} voltar={voltar} />;
  else if (det?.tipo === "contrato") conteudo = <ContratoDetalhe d={d} upItem={upItem} id={det.id} voltar={voltar} />;
  else if (det?.tipo === "ativo") conteudo = <AtivoDetalhe d={d} up={up} upItem={upItem} c={c} id={det.id} voltar={voltar} />;
  else if (aba === "painel") conteudo = <Painel d={d} c={c} fases={fases} travas={travas} proximaMeta={proximaMeta} valorMeta={valorMeta} />;
  else if (aba === "custos") conteudo = <Custos d={d} up={up} c={c} />;
  else if (aba === "contratos") conteudo = <Contratos d={d} up={up} c={c} abrir={(id) => irPara("contrato", id)} />;
  else if (aba === "obras") conteudo = <Obras d={d} up={up} c={c} abrir={(id) => irPara("obra", id)} />;
  else if (aba === "caixa") conteudo = <Caixa d={d} up={up} c={c} />;
  else if (aba === "metas") conteudo = <Metas d={d} up={up} c={c} valorMeta={valorMeta} />;
  else if (aba === "ativos") conteudo = <Ativos d={d} up={up} c={c} abrir={(id) => irPara("ativo", id)} />;
  else if (aba === "vida") conteudo = <Vida d={d} up={up} c={c} />;
  else if (aba === "backup") conteudo = <Backup d={d} up={up} />;
  else conteudo = <Clientes d={d} up={up} />;

  return (
    <div className="dl">
      <style>{CSS}</style>
      <div className="dl-head">
        <h1>Dialética</h1>
        <span className="dl-sub">{faseAtual.n} · {faseAtual.nome}</span>
      </div>
      <div className="dl-tabs">
        {abas.map(([k, r]) => (
          <button key={k} className={"dl-tab" + (aba === k && !det ? " dl-tab-on" : "")} onClick={() => { setAba(k); setDet(null); }}>{r}</button>
        ))}
      </div>
      {conteudo}
      {status && <div className="dl-save">{status}</div>}
    </div>
  );
}

/* ============================== PAINEL ============================== */
function Painel({ d, c, fases, travas, proximaMeta, valorMeta }) {
  const [aberta, setAberta] = useState(null);
  const cor = c.cobertura >= 100 ? "var(--terra)" : c.cobertura >= 60 ? "var(--cobre)" : "var(--fase)";
  return (
    <>
      <div className="dl-meter">
        <div className="dl-meter-top">
          <div>
            <p className="dl-stat-label">Do custo fixo coberto por contrato recorrente</p>
            <div className="dl-big" style={{ color: cor }}>{c.custoFixo > 0 ? Math.round(c.cobertura) : 0}%</div>
          </div>
          <div style={{ textAlign: "right" }}>
            <p className="dl-stat-label">falta cobrir</p>
            <div className="dl-stat-val">{brl(Math.max(0, c.custoFixo - c.recorrente))}</div>
          </div>
        </div>
        <div className="dl-bus"><div className="dl-bus-fill" style={{ width: Math.min(100, c.cobertura) + "%", background: cor }} /></div>
        <div className="dl-legend"><span>recorrente {brl(c.recorrente)}</span><span>custo fixo {brl(c.custoFixo)}</span></div>
      </div>

      {c.custoVida > 0 && (
        <div className="dl-meter" style={{ marginTop: 10 }}>
          <div className="dl-meter-top">
            <div>
              <p className="dl-stat-label">Da sua vida paga por renda que não depende do seu trabalho</p>
              <div className="dl-big" style={{ color: c.independencia >= 100 ? "var(--terra)" : c.independencia >= 40 ? "var(--cobre)" : "var(--neutro)" }}>{Math.round(c.independencia)}%</div>
            </div>
            <div style={{ textAlign: "right" }}>
              <p className="dl-stat-label">patrimônio</p>
              <div className="dl-stat-val">{brl(c.patrimonio)}</div>
            </div>
          </div>
          <div className="dl-bus"><div className="dl-bus-fill" style={{ width: Math.min(100, c.independencia) + "%", background: c.independencia >= 100 ? "var(--terra)" : "var(--neutro)" }} /></div>
          <div className="dl-legend"><span>renda passiva {brl(c.rendaPassiva)}</span><span>custo de vida {brl(c.custoVida)}</span></div>
        </div>
      )}

      {proximaMeta && (
        <div className="dl-info" style={{ marginTop: 10, marginBottom: 0 }}>
          <h3>Próximo objetivo: {proximaMeta.nome}</h3>
          <p className="dl-row-s">Faltam {brl(num(proximaMeta.alvo) - valorMeta(proximaMeta))} de {brl(num(proximaMeta.alvo))}{proximaMeta.prazo ? " · até " + br(proximaMeta.prazo) : ""}</p>
          <div className="dl-prog"><i style={{ width: Math.min(100, (valorMeta(proximaMeta) / (num(proximaMeta.alvo) || 1)) * 100) + "%" }} /></div>
        </div>
      )}

      <div className="dl-grid">
        <div className="dl-stat"><p className="dl-stat-label">Caixa hoje</p><div className="dl-stat-val">{brl(c.caixa)}</div></div>
        <div className="dl-stat">
          <p className="dl-stat-label">Reserva</p>
          <div className="dl-stat-val" style={{ color: c.reservaMeses >= 6 ? "var(--terra)" : c.reservaMeses >= 3 ? "var(--cobre)" : "var(--fase)" }}>{c.reservaMeses.toFixed(1)} meses</div>
        </div>
        <div className="dl-stat"><p className="dl-stat-label">A receber</p><div className="dl-stat-val">{brl(c.aReceber)}</div></div>
        <div className="dl-stat"><p className="dl-stat-label">A pagar</p><div className="dl-stat-val">{brl(c.aPagar)}</div></div>
        <div className="dl-stat"><p className="dl-stat-label">Margem das obras</p><div className="dl-stat-val">{brl(c.margemObras)}</div></div>
        <div className="dl-stat"><p className="dl-stat-label">Renda de ativos</p><div className="dl-stat-val">{brl(c.rendaAtivos)}</div></div>
      </div>

      {travas.length > 0 && (
        <div className="dl-alert">
          <h3>{travas.length === 1 ? "Trava acionada" : "Travas acionadas"}</h3>
          {travas.map((t, i) => <p key={i} style={{ marginTop: i ? 7 : 0 }}>{t}</p>)}
        </div>
      )}

      {(d.obras.length + d.contratos.length + d.lancamentos.length + d.custos.length) > 0 &&
        (!d.ultimoBackup || dias(d.ultimoBackup, hoje()) > 30) && (
        <div className="dl-info" style={{ marginTop: 14, marginBottom: 0 }}>
          <h3>Backup</h3>
          <p>{d.ultimoBackup ? "Seu último backup foi em " + br(d.ultimoBackup) + "." : "Você ainda não fez nenhum backup."} Vá na aba Backup e guarde uma cópia.</p>
        </div>
      )}

      <div className="dl-bar">
        <div className="dl-spine" />
        {fases.map((f, i) => (
          <div className="dl-phase" key={i}>
            <div className={"dl-brk " + (f.fechada ? "dl-brk-on" : f.atual ? "dl-brk-live" : "dl-brk-off")}><span /></div>
            <button className={"dl-phase-btn" + (f.atual ? " dl-phase-live" : "")} onClick={() => setAberta(aberta === i ? null : i)}>
              <span className="dl-row-main">
                <span className="dl-phase-name">{f.nome}</span>
                <span className="dl-row-s" style={{ display: "block" }}>{f.n}</span>
              </span>
              <span className="dl-row-s">{f.fechada ? "fechada" : f.atual ? "em curso" : "aguardando"}</span>
            </button>
            {aberta === i && (
              <div className="dl-cond">
                {f.cond.map((k, j) => (
                  <div className="dl-cond-row" key={j}><span className={"dl-dot" + (k.ok ? " dl-dot-ok" : "")} /><span>{k.t}</span></div>
                ))}
              </div>
            )}
          </div>
        ))}
      </div>
    </>
  );
}

/* ============================== CUSTOS ============================== */
function Custos({ d, up, c }) {
  const [tipo, setTipo] = useState("fixo");
  const [nome, setNome] = useState("");
  const [valor, setValor] = useState("");
  const [unidade, setUnidade] = useState("mes");

  const add = (n) => {
    const t = (n ?? nome).trim();
    if (!t) return;
    up({ custos: [...d.custos, { id: uid(), nome: t, valor: n ? "" : valor, tipo, unidade: tipo === "variavel" ? unidade : "mes" }] });
    if (!n) { setNome(""); setValor(""); }
  };
  const edit = (id, k, v) => up({ custos: d.custos.map((x) => (x.id === id ? { ...x, [k]: v } : x)) });
  const usados = d.custos.map((x) => (x.nome || "").toLowerCase());
  const sug = tipo === "fixo" ? SUG_FIXO : SUG_VAR;
  const lista = d.custos.filter((x) => (tipo === "fixo" ? x.tipo !== "variavel" : x.tipo === "variavel"));

  return (
    <div className="dl-sec">
      <h2>Custos</h2>
      <div className="dl-sub2" style={{ marginTop: 8 }}>
        <button className={tipo === "fixo" ? "on" : ""} onClick={() => setTipo("fixo")}>Fixos · {brl(c.custoFixo)}</button>
        <button className={tipo === "variavel" ? "on" : ""} onClick={() => setTipo("variavel")}>Variáveis</button>
      </div>
      <p className="dl-note">
        {tipo === "fixo"
          ? "Sai todo mês mesmo sem obra nenhuma. É esse número que os contratos de manutenção precisam cobrir."
          : "Só existe quando tem obra. Serve para você calcular preço e margem, não entra na conta da Fase 1."}
      </p>

      <p className="dl-stat-label" style={{ marginBottom: 6 }}>Toque para adicionar e depois preencha o valor</p>
      <div className="dl-chips">
        {sug.map((s) => (
          <button key={s} className={"dl-chip" + (usados.includes(s.toLowerCase()) ? " dl-chip-used" : "")}
            onClick={() => !usados.includes(s.toLowerCase()) && add(s)}>{s}</button>
        ))}
      </div>

      <div className="dl-form">
        <div className="dl-f">
          <input className="dl-in" placeholder="Outro item" value={nome} onChange={(e) => setNome(e.target.value)} />
          <input className="dl-in" style={{ maxWidth: 110 }} inputMode="decimal" placeholder="R$" value={valor} onChange={(e) => setValor(e.target.value)} />
        </div>
        {tipo === "variavel" && (
          <div className="dl-f">
            <select className="dl-in" value={unidade} onChange={(e) => setUnidade(e.target.value)}>
              <option value="mes">por mês (estimativa)</option>
              <option value="obra">por obra</option>
              <option value="percentual">% do contrato</option>
            </select>
          </div>
        )}
        <button className="dl-btn" onClick={() => add()}>Adicionar</button>
      </div>

      {lista.length === 0 && <div className="dl-empty">Nada aqui ainda. {tipo === "fixo" ? "Comece pelo pró-labore." : "Comece por material elétrico e mão de obra."}</div>}
      {lista.map((x) => (
        <div className="dl-row" key={x.id}>
          <div className="dl-row-main">
            <div className="dl-row-t">{x.nome}</div>
            {tipo === "variavel" && <div className="dl-row-s">{x.unidade === "mes" ? "por mês" : x.unidade === "obra" ? "por obra" : "% do contrato"}</div>}
          </div>
          <input className="dl-in" style={{ maxWidth: 108, textAlign: "right" }} inputMode="decimal" value={x.valor}
            placeholder="R$" onChange={(e) => edit(x.id, "valor", e.target.value)} />
          <button className="dl-x" onClick={() => up({ custos: d.custos.filter((y) => y.id !== x.id) })}>×</button>
        </div>
      ))}
      <div className="dl-total">
        <span>{tipo === "fixo" ? "Custo fixo total" : "Variável estimado por mês"}</span>
        <b>{brl(tipo === "fixo" ? c.custoFixo : c.varMensal)}</b>
      </div>
    </div>
  );
}

/* ============================ RECORRENTE ============================ */
function Contratos({ d, up, c, abrir }) {
  const [f, setF] = useState({ cliente: "", valor: "", meses: "12", inicio: hoje(), escopo: "" });
  const add = () => {
    if (!f.cliente.trim()) return;
    up({ contratos: [...d.contratos, { id: uid(), ...f, ativo: true, visitas: [] }] });
    setF({ cliente: "", valor: "", meses: "12", inicio: hoje(), escopo: "" });
  };
  const falta = Math.max(0, c.custoFixo - c.recorrente);
  return (
    <div className="dl-sec">
      <h2>Contratos de manutenção</h2>
      <p className="dl-note">{c.custoFixo > 0 ? "Faltam " + brl(falta) + " por mês para fechar a Fase 1." : "Cadastre o custo fixo primeiro para ver quanto falta."}</p>
      <div className="dl-form">
        <div className="dl-f"><input className="dl-in" placeholder="Cliente" value={f.cliente} onChange={(e) => setF({ ...f, cliente: e.target.value })} /></div>
        <div className="dl-f">
          <input className="dl-in" inputMode="decimal" placeholder="R$ por mês" value={f.valor} onChange={(e) => setF({ ...f, valor: e.target.value })} />
          <input className="dl-in" style={{ maxWidth: 96 }} inputMode="numeric" placeholder="meses" value={f.meses} onChange={(e) => setF({ ...f, meses: e.target.value })} />
        </div>
        <div className="dl-f"><input className="dl-in" type="date" value={f.inicio} onChange={(e) => setF({ ...f, inicio: e.target.value })} /></div>
        <div className="dl-f"><input className="dl-in" placeholder="Escopo do contrato" value={f.escopo} onChange={(e) => setF({ ...f, escopo: e.target.value })} /></div>
        <button className="dl-btn" onClick={add}>Adicionar contrato</button>
      </div>
      {d.contratos.length === 0 && <div className="dl-empty">Alvos em São Mateus: supermercados, postos, galpões do polo industrial, clínicas, hotéis de Guriri e prédios comerciais.</div>}
      {d.contratos.map((x) => {
        const vis = x.visitas || [];
        const prox = vis.filter((v) => !v.feita && v.data).sort((a, b) => a.data.localeCompare(b.data))[0];
        return (
          <div className="dl-row" key={x.id}>
            <button className="dl-row-main dl-row-btn" style={{ border: "none", background: "none", padding: 0 }} onClick={() => abrir(x.id)}>
              <div className="dl-row-t">{x.cliente}</div>
              <div className="dl-row-s">
                {x.ativo === false ? "encerrado · " : ""}{prox ? "próxima visita " + br(prox.data) : vis.length ? "sem visita agendada" : "nenhuma visita cadastrada"}
              </div>
            </button>
            <div className="dl-row-v" style={{ color: x.ativo === false ? "var(--muted)" : "var(--terra)" }}>{brl(num(x.valor))}</div>
            <button className="dl-x" onClick={() => abrir(x.id)}>›</button>
          </div>
        );
      })}
      <div className="dl-total"><span>Recorrente ativo</span><b>{brl(c.recorrente)}</b></div>
    </div>
  );
}

function ContratoDetalhe({ d, upItem, id, voltar }) {
  const x = d.contratos.find((y) => y.id === id);
  const [v, setV] = useState({ data: hoje(), servico: "", obs: "" });
  if (!x) return <button className="dl-back" onClick={voltar}>‹ voltar</button>;
  const vis = (x.visitas || []).slice().sort((a, b) => (a.data || "").localeCompare(b.data || ""));
  const addVisita = () => {
    if (!v.data) return;
    upItem("contratos", id, { visitas: [...(x.visitas || []), { id: uid(), ...v, feita: false }] });
    setV({ data: hoje(), servico: "", obs: "" });
  };
  const setVis = (vid, patch) => upItem("contratos", id, { visitas: (x.visitas || []).map((k) => (k.id === vid ? { ...k, ...patch } : k)) });

  return (
    <div className="dl-sec">
      <button className="dl-back" onClick={voltar}>‹ contratos</button>
      <h2>{x.cliente}</h2>
      <p className="dl-note">{brl(num(x.valor))} por mês · {x.meses} meses desde {br(x.inicio)}</p>

      <div className="dl-form">
        <div className="dl-f">
          <input className="dl-in" inputMode="decimal" value={x.valor} placeholder="R$ mês" onChange={(e) => upItem("contratos", id, { valor: e.target.value })} />
          <select className="dl-in" style={{ maxWidth: 130 }} value={x.ativo === false ? "n" : "s"} onChange={(e) => upItem("contratos", id, { ativo: e.target.value === "s" })}>
            <option value="s">ativo</option><option value="n">encerrado</option>
          </select>
        </div>
        <textarea className="dl-in dl-ta" placeholder="Escopo: o que está incluso na visita" value={x.escopo || ""} onChange={(e) => upItem("contratos", id, { escopo: e.target.value })} />
      </div>

      <h3 style={{ marginBottom: 8 }}>Agenda de visitas</h3>
      <div className="dl-form">
        <div className="dl-f">
          <input className="dl-in" type="date" value={v.data} onChange={(e) => setV({ ...v, data: e.target.value })} />
          <input className="dl-in" placeholder="Serviço" value={v.servico} onChange={(e) => setV({ ...v, servico: e.target.value })} />
        </div>
        <div className="dl-f"><textarea className="dl-in dl-ta" placeholder="Observações: o que verificar, o que ficou pendente" value={v.obs} onChange={(e) => setV({ ...v, obs: e.target.value })} /></div>
        <button className="dl-btn" onClick={addVisita}>Agendar visita</button>
      </div>

      {vis.length === 0 && <div className="dl-empty">Nenhuma visita agendada.</div>}
      {vis.map((k) => {
        const atrasada = !k.feita && k.data < hoje();
        return (
          <div key={k.id} style={{ marginBottom: 7 }}>
            <div className="dl-row" style={{ marginBottom: 0 }}>
              <div className="dl-row-main">
                <div className="dl-row-t">{br(k.data)} · {k.servico || "visita"}</div>
                {k.obs && <div className="dl-row-s">{k.obs}</div>}
              </div>
              <span className={"dl-pill" + (k.feita ? " dl-pill-ok" : atrasada ? " dl-pill-bad" : "")}>{k.feita ? "feita" : atrasada ? "atrasada" : "agendada"}</span>
              <button className="dl-x" onClick={() => setVis(k.id, { feita: !k.feita })}>{k.feita ? "↺" : "✓"}</button>
              <button className="dl-x" onClick={() => upItem("contratos", id, { visitas: (x.visitas || []).filter((y) => y.id !== k.id) })}>×</button>
            </div>
          </div>
        );
      })}
    </div>
  );
}

/* =============================== OBRAS =============================== */
function Obras({ d, up, c, abrir }) {
  const [f, setF] = useState({ cliente: "", nome: "", contrato: "", custoPrevisto: "", inicio: hoje(), prazo: "" });
  const add = () => {
    if (!f.cliente.trim() && !f.nome.trim()) return;
    up({ obras: [...d.obras, { id: uid(), ...f, status: "andamento", medicoes: [], gastos: [], etapas: [], equipe: [], obs: "" }] });
    setF({ cliente: "", nome: "", contrato: "", custoPrevisto: "", inicio: hoje(), prazo: "" });
  };
  return (
    <div className="dl-sec">
      <h2>Obras</h2>
      <p className="dl-note">Cadastre a obra aqui e entre nela para lançar medição, gasto, etapa e equipe.</p>
      <div className="dl-form">
        <div className="dl-f">
          <input className="dl-in" placeholder="Cliente" value={f.cliente} onChange={(e) => setF({ ...f, cliente: e.target.value })} />
          <input className="dl-in" placeholder="Obra" value={f.nome} onChange={(e) => setF({ ...f, nome: e.target.value })} />
        </div>
        <div className="dl-f">
          <input className="dl-in" inputMode="decimal" placeholder="Contrato R$" value={f.contrato} onChange={(e) => setF({ ...f, contrato: e.target.value })} />
          <input className="dl-in" inputMode="decimal" placeholder="Custo previsto R$" value={f.custoPrevisto} onChange={(e) => setF({ ...f, custoPrevisto: e.target.value })} />
        </div>
        <div className="dl-f">
          <input className="dl-in" type="date" value={f.inicio} onChange={(e) => setF({ ...f, inicio: e.target.value })} />
          <input className="dl-in" type="date" value={f.prazo} onChange={(e) => setF({ ...f, prazo: e.target.value })} />
        </div>
        <button className="dl-btn" onClick={add}>Criar obra</button>
      </div>
      {d.obras.length === 0 && <div className="dl-empty">Nenhuma obra cadastrada.</div>}
      {d.obras.map((o) => {
        const k = c.obraCalc[o.id];
        return (
          <div className="dl-row" key={o.id}>
            <button className="dl-row-main dl-row-btn" style={{ border: "none", background: "none", padding: 0 }} onClick={() => abrir(o.id)}>
              <div className="dl-row-t">{o.nome || o.cliente}</div>
              <div className="dl-row-s">{o.cliente && o.nome ? o.cliente + " · " : ""}margem {brl(k.margem)} · a receber {brl(k.aReceber)}</div>
              <div className="dl-prog" style={{ marginTop: 6 }}><i style={{ width: k.progresso + "%" }} /></div>
            </button>
            <button className="dl-x" onClick={() => abrir(o.id)}>›</button>
          </div>
        );
      })}
      <div className="dl-total"><span>Margem acumulada</span><b>{brl(c.margemObras)}</b></div>
    </div>
  );
}

function ObraDetalhe({ d, up, upItem, c, id, voltar }) {
  const o = d.obras.find((x) => x.id === id);
  const [sub, setSub] = useState("resumo");
  const [med, setMed] = useState({ data: hoje(), descricao: "", valor: "" });
  const [gas, setGas] = useState({ data: hoje(), descricao: "", valor: "", cat: "material" });
  const [eta, setEta] = useState("");
  const [eq, setEq] = useState({ nome: "", funcao: "", diaria: "" });
  if (!o) return <button className="dl-back" onClick={voltar}>‹ voltar</button>;
  const k = c.obraCalc[id];
  const patchLista = (campo, arr) => upItem("obras", id, { [campo]: arr });

  const lancarNoCaixa = (m) => {
    up({
      obras: d.obras.map((x) => (x.id === id ? { ...x, medicoes: (x.medicoes || []).map((y) => (y.id === m.id ? { ...y, recebida: true } : y)) } : x)),
      lancamentos: [{ id: uid(), data: hoje(), desc: (o.nome || o.cliente) + " · " + (m.descricao || "medição"), valor: m.valor,
        tipo: "e", forma: "Pix", status: "pago", categoria: "obra", obraId: id }, ...d.lancamentos],
    });
  };

  return (
    <div className="dl-sec">
      <button className="dl-back" onClick={voltar}>‹ obras</button>
      <h2>{o.nome || o.cliente}</h2>
      <p className="dl-note">{o.cliente}{o.prazo ? " · prazo " + br(o.prazo) : ""}</p>

      <div className="dl-sub2">
        {[["resumo", "Resumo"], ["medicoes", "Medições"], ["gastos", "Gastos"], ["etapas", "Etapas"], ["equipe", "Equipe"]].map(([kk, r]) => (
          <button key={kk} className={sub === kk ? "on" : ""} onClick={() => setSub(kk)}>{r}</button>
        ))}
      </div>

      {sub === "resumo" && (
        <>
          <div className="dl-grid" style={{ marginTop: 0 }}>
            <div className="dl-stat"><p className="dl-stat-label">Contrato</p><div className="dl-stat-val">{brl(num(o.contrato))}</div></div>
            <div className="dl-stat"><p className="dl-stat-label">Gasto real</p><div className="dl-stat-val">{brl(k.gasto)}</div></div>
            <div className="dl-stat"><p className="dl-stat-label">Margem</p><div className="dl-stat-val" style={{ color: k.margem >= 0 ? "var(--terra)" : "var(--fase)" }}>{brl(k.margem)}</div></div>
            <div className="dl-stat"><p className="dl-stat-label">A receber</p><div className="dl-stat-val">{brl(k.aReceber)}</div></div>
            <div className="dl-stat"><p className="dl-stat-label">Ainda não medido</p><div className="dl-stat-val">{brl(k.naoMedido)}</div></div>
            <div className="dl-stat"><p className="dl-stat-label">Execução</p><div className="dl-stat-val">{k.progresso.toFixed(0)}%</div></div>
          </div>
          {k.gasto > num(o.custoPrevisto) && num(o.custoPrevisto) > 0 && (
            <div className="dl-alert"><h3>Estouro de custo</h3><p>O gasto real passou o previsto em {brl(k.gasto - num(o.custoPrevisto))}.</p></div>
          )}
          <div className="dl-form" style={{ marginTop: 12 }}>
            <div className="dl-f">
              <input className="dl-in" inputMode="decimal" value={o.contrato} placeholder="Contrato R$" onChange={(e) => upItem("obras", id, { contrato: e.target.value })} />
              <input className="dl-in" inputMode="decimal" value={o.custoPrevisto} placeholder="Custo previsto" onChange={(e) => upItem("obras", id, { custoPrevisto: e.target.value })} />
            </div>
            <div className="dl-f">
              <select className="dl-in" value={o.status} onChange={(e) => upItem("obras", id, { status: e.target.value })}>
                <option value="orcamento">em orçamento</option><option value="andamento">em andamento</option><option value="fechada">encerrada</option>
              </select>
              <input className="dl-in" type="date" value={o.prazo || ""} onChange={(e) => upItem("obras", id, { prazo: e.target.value })} />
            </div>
            <textarea className="dl-in dl-ta" placeholder="Observações da obra" value={o.obs || ""} onChange={(e) => upItem("obras", id, { obs: e.target.value })} />
          </div>
          <button className="dl-btn-2" onClick={() => { up({ obras: d.obras.filter((x) => x.id !== id) }); voltar(); }}>Excluir obra</button>
        </>
      )}

      {sub === "medicoes" && (
        <>
          <p className="dl-note">Cada medição vira uma cobrança. Ao marcar como recebida, ela entra no caixa automaticamente.</p>
          <div className="dl-form">
            <div className="dl-f">
              <input className="dl-in" type="date" value={med.data} onChange={(e) => setMed({ ...med, data: e.target.value })} />
              <input className="dl-in" inputMode="decimal" placeholder="R$" value={med.valor} onChange={(e) => setMed({ ...med, valor: e.target.value })} />
            </div>
            <div className="dl-f"><input className="dl-in" placeholder="Descrição da medição" value={med.descricao} onChange={(e) => setMed({ ...med, descricao: e.target.value })} /></div>
            <button className="dl-btn" onClick={() => { if (!num(med.valor)) return; patchLista("medicoes", [...(o.medicoes || []), { id: uid(), ...med, recebida: false }]); setMed({ data: hoje(), descricao: "", valor: "" }); }}>Lançar medição</button>
          </div>
          {(o.medicoes || []).length === 0 && <div className="dl-empty">Nenhuma medição lançada.</div>}
          {(o.medicoes || []).map((m) => (
            <div className="dl-row" key={m.id}>
              <div className="dl-row-main">
                <div className="dl-row-t">{m.descricao || "medição"}</div>
                <div className="dl-row-s">{br(m.data)} · {m.recebida ? "recebida" : "a receber"}</div>
              </div>
              <div className="dl-row-v" style={{ color: m.recebida ? "var(--terra)" : "var(--cobre)" }}>{brl(num(m.valor))}</div>
              {!m.recebida && <button className="dl-x" title="marcar como recebida" onClick={() => lancarNoCaixa(m)}>✓</button>}
              <button className="dl-x" onClick={() => patchLista("medicoes", (o.medicoes || []).filter((y) => y.id !== m.id))}>×</button>
            </div>
          ))}
          <div className="dl-total"><span>Medido</span><b>{brl(k.med)}</b></div>
          <h3 style={{ marginTop: 18, marginBottom: 6 }}>Recebimentos</h3>
          <p className="dl-note">Tudo que entrou por essa obra, lançado aqui ou direto na aba Caixa.</p>
          {k.lanc.filter((l) => l.tipo === "e").length === 0 && <div className="dl-empty">Nada recebido ainda.</div>}
          {k.lanc.filter((l) => l.tipo === "e").map((l) => (
            <div className="dl-row" key={l.id}>
              <div className="dl-row-main"><div className="dl-row-t">{l.desc}</div><div className="dl-row-s">{br(l.data)} · {l.forma}{l.status === "previsto" ? " · previsto" : ""}</div></div>
              <div className="dl-row-v" style={{ color: "var(--terra)" }}>{brl(num(l.valor))}</div>
            </div>
          ))}
          <div className="dl-total"><span>Recebido</span><b>{brl(k.receb)}</b></div>
        </>
      )}

      {sub === "gastos" && (
        <>
          <div className="dl-form">
            <div className="dl-f">
              <input className="dl-in" type="date" value={gas.data} onChange={(e) => setGas({ ...gas, data: e.target.value })} />
              <input className="dl-in" inputMode="decimal" placeholder="R$" value={gas.valor} onChange={(e) => setGas({ ...gas, valor: e.target.value })} />
            </div>
            <div className="dl-f">
              <input className="dl-in" placeholder="Descrição" value={gas.descricao} onChange={(e) => setGas({ ...gas, descricao: e.target.value })} />
              <select className="dl-in" style={{ maxWidth: 130 }} value={gas.cat} onChange={(e) => setGas({ ...gas, cat: e.target.value })}>
                <option value="material">material</option><option value="maodeobra">mão de obra</option><option value="outro">outro</option>
              </select>
            </div>
            <button className="dl-btn" onClick={() => { if (!num(gas.valor)) return; up({ lancamentos: [{ id: uid(), data: gas.data, desc: gas.descricao || gas.cat, valor: gas.valor, tipo: "s", forma: "Pix", status: "pago", categoria: gas.cat === "outro" ? "outra" : gas.cat, obraId: id }, ...d.lancamentos] }); setGas({ data: hoje(), descricao: "", valor: "", cat: "material" }); }}>Lançar gasto</button>
          </div>
          <p className="dl-note">Todo gasto lançado aqui sai do caixa da empresa automaticamente.</p>
          {k.lanc.filter((l) => l.tipo === "s").length === 0 && <div className="dl-empty">Nenhum gasto lançado.</div>}
          {k.lanc.filter((l) => l.tipo === "s").map((g) => (
            <div className="dl-row" key={g.id}>
              <div className="dl-row-main"><div className="dl-row-t">{g.desc}</div><div className="dl-row-s">{br(g.data)} · {g.categoria}</div></div>
              <div className="dl-row-v" style={{ color: "var(--fase)" }}>{brl(num(g.valor))}</div>
              <button className="dl-x" onClick={() => up({ lancamentos: d.lancamentos.filter((y) => y.id !== g.id) })}>×</button>
            </div>
          ))}
          <div className="dl-total"><span>Gasto na obra</span><b>{brl(k.gasto)}</b></div>
        </>
      )}

      {sub === "etapas" && (
        <>
          <div className="dl-form">
            <div className="dl-f"><input className="dl-in" placeholder="Etapa (ex: infra de eletrodutos)" value={eta} onChange={(e) => setEta(e.target.value)} /></div>
            <button className="dl-btn" onClick={() => { if (!eta.trim()) return; patchLista("etapas", [...(o.etapas || []), { id: uid(), t: eta.trim(), ok: false }]); setEta(""); }}>Adicionar etapa</button>
          </div>
          {(o.etapas || []).length === 0 && <div className="dl-empty">Sem etapas. Elas alimentam a barra de execução da obra.</div>}
          {(o.etapas || []).map((e) => (
            <label className="dl-chk" key={e.id}>
              <input type="checkbox" checked={!!e.ok} onChange={() => patchLista("etapas", (o.etapas || []).map((y) => (y.id === e.id ? { ...y, ok: !y.ok } : y)))} />
              <span style={{ flex: 1 }}>{e.t}</span>
              <button className="dl-x" onClick={() => patchLista("etapas", (o.etapas || []).filter((y) => y.id !== e.id))}>×</button>
            </label>
          ))}
        </>
      )}

      {sub === "equipe" && (
        <>
          <div className="dl-form">
            <div className="dl-f">
              <input className="dl-in" placeholder="Nome" value={eq.nome} onChange={(e) => setEq({ ...eq, nome: e.target.value })} />
              <input className="dl-in" style={{ maxWidth: 120 }} inputMode="decimal" placeholder="diária R$" value={eq.diaria} onChange={(e) => setEq({ ...eq, diaria: e.target.value })} />
            </div>
            <div className="dl-f"><input className="dl-in" placeholder="Função" value={eq.funcao} onChange={(e) => setEq({ ...eq, funcao: e.target.value })} /></div>
            <button className="dl-btn" onClick={() => { if (!eq.nome.trim()) return; patchLista("equipe", [...(o.equipe || []), { id: uid(), ...eq }]); setEq({ nome: "", funcao: "", diaria: "" }); }}>Adicionar</button>
          </div>
          {(o.equipe || []).length === 0 && <div className="dl-empty">Ninguém alocado nessa obra.</div>}
          {(o.equipe || []).map((p) => (
            <div className="dl-row" key={p.id}>
              <div className="dl-row-main"><div className="dl-row-t">{p.nome}</div><div className="dl-row-s">{p.funcao}</div></div>
              <div className="dl-row-v">{brl(num(p.diaria))}</div>
              <button className="dl-x" onClick={() => patchLista("equipe", (o.equipe || []).filter((y) => y.id !== p.id))}>×</button>
            </div>
          ))}
        </>
      )}
    </div>
  );
}

/* =============================== CAIXA =============================== */
function Caixa({ d, up, c }) {
  const [sub, setSub] = useState("conta");
  return (
    <div className="dl-sec">
      <h2>Caixa</h2>
      <div className="dl-sub2" style={{ marginTop: 8 }}>
        {[["conta", "Conta"], ["receber", "A receber e a pagar"], ["fechar", "Fechar o mês"], ["fluxo", "Fluxo de caixa"]].map(([k, r]) => (
          <button key={k} className={sub === k ? "on" : ""} onClick={() => setSub(k)}>{r}</button>
        ))}
      </div>
      {sub === "conta" && <CaixaConta d={d} up={up} c={c} />}
      {sub === "receber" && <CaixaReceber d={d} up={up} c={c} />}
      {sub === "fechar" && <CaixaFechar d={d} up={up} c={c} />}
      {sub === "fluxo" && <CaixaFluxo d={d} c={c} />}
    </div>
  );
}

function CaixaConta({ d, up, c }) {
  const [f, setF] = useState({ tipo: "e", desc: "", valor: "", forma: "Pix", data: hoje(), categoria: "obra", status: "pago", vencimento: "" });
  const add = () => {
    if (!num(f.valor)) return;
    const l = { id: uid(), ...f, aporte: f.categoria === "ativo" && f.tipo === "s" && !!f.ativoId };
    up({ lancamentos: [l, ...d.lancamentos] });
    setF({ ...f, desc: "", valor: "", vencimento: "" });
  };
  const cats = f.tipo === "e"
    ? [["obra", "obra"], ["manutencao", "contrato de manutenção"], ["ativo", "ativo"], ["outra", "outra"]]
    : [["fixo", "custo fixo"], ["material", "material"], ["maodeobra", "mão de obra"], ["ativo", "aporte em ativo"], ["imposto", "imposto"], ["outra", "outra"]];
  const ligaObra = ["obra", "material", "maodeobra"].includes(f.categoria);
  const ligaAtivo = f.categoria === "ativo";
  return (
    <>
      <div className="dl-grid" style={{ marginTop: 0, marginBottom: 10 }}>
        <div className="dl-stat"><p className="dl-stat-label">Saldo em conta</p><div className="dl-stat-val">{brl(c.caixa)}</div></div>
        <div className="dl-stat">
          <p className="dl-stat-label">Saldo projetado</p>
          <div className="dl-stat-val">{brl(c.caixa + c.aReceber - c.aPagar)}</div>
        </div>
      </div>
      <div className="dl-form">
        <div className="dl-f"><input className="dl-in" inputMode="decimal" placeholder="Saldo inicial da conta" value={d.saldoInicial} onChange={(e) => up({ saldoInicial: e.target.value })} /></div>
      </div>

      <div className="dl-form">
        <div className="dl-f">
          <select className="dl-in" style={{ maxWidth: 120 }} value={f.tipo} onChange={(e) => setF({ ...f, tipo: e.target.value, categoria: e.target.value === "e" ? "obra" : "fixo" })}>
            <option value="e">recebi</option><option value="s">paguei</option>
          </select>
          <input className="dl-in" inputMode="decimal" placeholder="R$" value={f.valor} onChange={(e) => setF({ ...f, valor: e.target.value })} />
        </div>
        <div className="dl-f"><input className="dl-in" placeholder={f.tipo === "e" ? "De quem / referente a" : "Para quem / referente a"} value={f.desc} onChange={(e) => setF({ ...f, desc: e.target.value })} /></div>
        <div className="dl-f">
          <select className="dl-in" value={f.forma} onChange={(e) => setF({ ...f, forma: e.target.value })}>
            {FORMAS.map((x) => <option key={x} value={x}>{x}</option>)}
          </select>
          <select className="dl-in" value={f.categoria} onChange={(e) => setF({ ...f, categoria: e.target.value })}>
            {cats.map(([v, r]) => <option key={v} value={v}>{r}</option>)}
          </select>
        </div>
        {ligaObra && d.obras.length > 0 && (
          <div className="dl-f">
            <select className="dl-in" value={f.obraId || ""} onChange={(e) => setF({ ...f, obraId: e.target.value, ativoId: "" })}>
              <option value="">sem obra vinculada</option>
              {d.obras.map((o) => <option key={o.id} value={o.id}>{o.nome || o.cliente}</option>)}
            </select>
          </div>
        )}
        {ligaAtivo && d.ativos.length > 0 && (
          <div className="dl-f">
            <select className="dl-in" value={f.ativoId || ""} onChange={(e) => setF({ ...f, ativoId: e.target.value, obraId: "", aporte: f.tipo === "s" })}>
              <option value="">sem ativo vinculado</option>
              {d.ativos.map((a) => <option key={a.id} value={a.id}>{a.nome}</option>)}
            </select>
          </div>
        )}
        <div className="dl-f">
          <select className="dl-in" style={{ maxWidth: 145 }} value={f.status} onChange={(e) => setF({ ...f, status: e.target.value })}>
            <option value="pago">já entrou / saiu</option><option value="previsto">ainda vai cair</option>
          </select>
          <input className="dl-in" type="date" value={f.status === "previsto" ? f.vencimento || "" : f.data}
            onChange={(e) => setF(f.status === "previsto" ? { ...f, vencimento: e.target.value } : { ...f, data: e.target.value })} />
        </div>
        <button className="dl-btn" onClick={add}>Lançar</button>
      </div>

      <h3 style={{ marginBottom: 8 }}>Movimento</h3>
      {d.lancamentos.filter((l) => l.status !== "previsto").length === 0 && <div className="dl-empty">Nenhum movimento ainda.</div>}
      {d.lancamentos.filter((l) => l.status !== "previsto").slice(0, 50).map((l) => (
        <div className="dl-row" key={l.id}>
          <div className="dl-row-main">
            <div className="dl-row-t">{l.desc || l.categoria}</div>
            <div className="dl-row-s">{br(l.data)} · {l.forma} · {l.categoria}
              {l.obraId && (d.obras.find((o) => o.id === l.obraId) ? " · " + (d.obras.find((o) => o.id === l.obraId).nome || d.obras.find((o) => o.id === l.obraId).cliente) : "")}
              {l.ativoId && (d.ativos.find((a) => a.id === l.ativoId) ? " · " + d.ativos.find((a) => a.id === l.ativoId).nome : "")}
            </div>
          </div>
          <div className="dl-row-v" style={{ color: l.tipo === "e" ? "var(--terra)" : "var(--fase)" }}>{l.tipo === "e" ? "+" : "−"}{brl(num(l.valor))}</div>
          <button className="dl-x" onClick={() => up({ lancamentos: d.lancamentos.filter((y) => y.id !== l.id) })}>×</button>
        </div>
      ))}
      <div className="dl-total"><span>Saldo</span><b>{brl(c.caixa)}</b></div>
    </>
  );
}

function CaixaReceber({ d, up, c }) {
  const prev = d.lancamentos.filter((l) => l.status === "previsto")
    .sort((a, b) => (a.vencimento || "9999").localeCompare(b.vencimento || "9999"));
  const baixar = (l) => up({ lancamentos: d.lancamentos.map((y) => (y.id === l.id ? { ...y, status: "pago", data: hoje() } : y)) });
  return (
    <>
      <div className="dl-grid" style={{ marginTop: 0, marginBottom: 12 }}>
        <div className="dl-stat"><p className="dl-stat-label">A receber</p><div className="dl-stat-val" style={{ color: "var(--terra)" }}>{brl(c.aReceber)}</div></div>
        <div className="dl-stat"><p className="dl-stat-label">A pagar</p><div className="dl-stat-val" style={{ color: "var(--fase)" }}>{brl(c.aPagar)}</div></div>
      </div>
      {c.atrasados.length > 0 && (
        <div className="dl-alert"><h3>Cobrar hoje</h3>
          {c.atrasados.map((l) => <p key={l.id}>{l.desc} · {brl(num(l.valor))} · venceu {br(l.vencimento)} ({dias(l.vencimento, hoje())} dias)</p>)}
        </div>
      )}
      {prev.length === 0 && <div className="dl-empty">Nada previsto. Lance na aba Conta escolhendo “ainda vai cair”.</div>}
      {prev.map((l) => {
        const atras = l.vencimento && l.vencimento < hoje();
        const faltam = l.vencimento ? dias(hoje(), l.vencimento) : null;
        return (
          <div className="dl-row" key={l.id}>
            <div className="dl-row-main">
              <div className="dl-row-t">{l.desc || l.categoria}</div>
              <div className="dl-row-s">
                {l.tipo === "e" ? "receber" : "pagar"} · {l.vencimento ? br(l.vencimento) : "sem data"}
                {faltam !== null && (atras ? " · vencido há " + Math.abs(faltam) + " dias" : " · em " + faltam + " dias")}
              </div>
            </div>

            <button className="dl-x" title="dar baixa" onClick={() => baixar(l)}>✓</button>
            <button className="dl-x" onClick={() => up({ lancamentos: d.lancamentos.filter((y) => y.id !== l.id) })}>×</button>

function CaixaFluxo({ d, c }) {
  const linhas = useMemo(() => {
    const base = ymHoje();
    const meses = [-3, -2, -1, 0, 1, 2].map((k) => addMes(base, k));
    const zero = () => Object.fromEntries(meses.map((m) => [m, 0]));
    const ent = { obra: zero(), manutencao: zero(), ativo: zero(), outra: zero() };
    const sai = { fixo: zero(), material: zero(), maodeobra: zero(), imposto: zero(), outra: zero() };
    d.lancamentos.forEach((l) => {
      const ym = (l.status === "previsto" ? l.vencimento : l.data) || hoje();
      const m = ym.slice(0, 7);
      if (!meses.includes(m)) return;
      const alvo = l.tipo === "e" ? ent : sai;
      const cat = alvo[l.categoria] ? l.categoria : "outra";
      alvo[cat][m] += num(l.valor);
    });
    // projeção dos meses futuros
    meses.forEach((m) => {
      if (m > base) {
        ent.manutencao[m] += c.recorrente;
        sai.fixo[m] += c.custoFixo;
      }
    });
    return { meses, ent, sai };
  }, [d, c]);

  const { meses, ent, sai } = linhas;
  const somaCol = (obj, m) => Object.values(obj).reduce((s, r) => s + r[m], 0);
  let acumulado = num(d.saldoInicial);
  const saldos = {};
  meses.forEach((m) => { acumulado += somaCol(ent, m) - somaCol(sai, m); saldos[m] = acumulado; });

  const nomes = { obra: "Obras", manutencao: "Contratos de manutenção", ativo: "Ativos", outra: "Outras",
    fixo: "Custo fixo", material: "Material", maodeobra: "Mão de obra", imposto: "Impostos" };

  return (
    <>
      <p className="dl-note">Realizado nos meses passados, projetado nos futuros usando o custo fixo e o recorrente já cadastrados.</p>
      <div className="dl-scroll">
        <table className="dl-table">
          <thead><tr><th>Linha</th>{meses.map((m) => <th key={m}>{mesLabel(m)}</th>)}</tr></thead>
          <tbody>
            <tr className="g"><td>Entradas</td>{meses.map((m) => <td key={m}>{brl(somaCol(ent, m))}</td>)}</tr>
            {Object.keys(ent).map((k) => (
              <tr key={k}><td>{nomes[k]}</td>{meses.map((m) => <td key={m}>{ent[k][m] ? brl(ent[k][m]) : "—"}</td>)}</tr>
            ))}
            <tr className="g"><td>Saídas</td>{meses.map((m) => <td key={m}>{brl(somaCol(sai, m))}</td>)}</tr>
            {Object.keys(sai).map((k) => (
              <tr key={k}><td>{nomes[k] || "Outras"}</td>{meses.map((m) => <td key={m}>{sai[k][m] ? brl(sai[k][m]) : "—"}</td>)}</tr>
            ))}
            <tr className="r"><td>Resultado do mês</td>{meses.map((m) => <td key={m} style={{ color: somaCol(ent, m) - somaCol(sai, m) < 0 ? "#B4292E" : "#4F8B3B" }}>{brl(somaCol(ent, m) - somaCol(sai, m))}</td>)}</tr>
            <tr className="r"><td>Saldo acumulado</td>{meses.map((m) => <td key={m} style={{ color: saldos[m] < 0 ? "#B4292E" : undefined }}>{brl(saldos[m])}</td>)}</tr>
          </tbody>
        </table>
      </div>
      <div className="dl-info" style={{ marginTop: 12 }}>
        <h3>Ponto de equilíbrio</h3>
        <p>Com custo fixo de {brl(c.custoFixo)} e variável estimado de {brl(c.varMensal)}, a empresa precisa faturar pelo menos {brl(c.custoFixo + c.varMensal)} por mês para não consumir caixa.</p>
      </div>
    </>
  );
}

function Metas({ d, up, c, valorMeta }) {
  const [f, setF] = useState({ nome: "", alvo: "", prazo: "", fonte: "manual", atual: "" });
  const [sub, setSub] = useState("");
  const add = () => {
    if (!f.nome.trim()) return;
    up({ metas: [...d.metas, { id: uid(), ...f, submetas: [] }] });
    setF({ nome: "", alvo: "", prazo: "", fonte: "manual", atual: "" });
  };
  const edit = (id, patch) => up({ metas: d.metas.map((m) => (m.id === id ? { ...m, ...patch } : m)) });
  const p = d.potes;
  const bloqueado = c.reservaMeses < 6;
  const [lucro, setLucro] = useState("");
  const distribuir = () => {
    const v = num(lucro);
    if (v <= 0) return;
    const paraReserva = bloqueado ? v * ((p.reserva + p.ativos) / 100) : v * (p.reserva / 100);
    up({ reserva: String(num(d.reserva) + paraReserva), giro: String(num(d.giro) + v * (p.giro / 100)),
      fundoAtivos: String(num(d.fundoAtivos) + (bloqueado ? 0 : v * (p.ativos / 100))) });
    setLucro("");
  };

  return (
    <div className="dl-sec">
      <h2>Metas</h2>
      <p className="dl-note">Meta com fonte automática se atualiza sozinha conforme você usa o painel.</p>
      <div className="dl-form">
        <div className="dl-f"><input className="dl-in" placeholder="Objetivo" value={f.nome} onChange={(e) => setF({ ...f, nome: e.target.value })} /></div>
        <div className="dl-f">
          <input className="dl-in" inputMode="decimal" placeholder="Alvo R$" value={f.alvo} onChange={(e) => setF({ ...f, alvo: e.target.value })} />
          <input className="dl-in" type="date" value={f.prazo} onChange={(e) => setF({ ...f, prazo: e.target.value })} />
        </div>
        <div className="dl-f">
          <select className="dl-in" value={f.fonte} onChange={(e) => setF({ ...f, fonte: e.target.value })}>
            <option value="manual">acompanho na mão</option>
            <option value="recorrente">soma dos contratos recorrentes</option>
            <option value="reserva">valor da reserva</option>
            <option value="caixa">saldo em caixa</option>
            <option value="ativos">renda dos ativos</option>
          </select>
        </div>
        <button className="dl-btn" onClick={add}>Criar meta</button>
      </div>

      {d.metas.length === 0 && (
        <div className="dl-empty">
          Sugestões para começar: recorrente cobrir o custo fixo de {brl(c.custoFixo || 0)}; reserva de 6 meses; primeiro ativo comprado.
        </div>
      )}
      {d.metas.map((m) => {
        const at = valorMeta(m), alvo = num(m.alvo);
        const pct = alvo > 0 ? Math.min(100, (at / alvo) * 100) : 0;
        const pronta = at >= alvo && alvo > 0;
        const subs = m.submetas || [];
        return (
          <div key={m.id} style={{ marginBottom: 9 }}>
            <div className="dl-row" style={{ marginBottom: 0, display: "block", borderColor: pronta ? "var(--terra)" : undefined }}>
              <div style={{ display: "flex", justifyContent: "space-between", gap: 10 }}>
                <div className="dl-row-main">
                  <div className="dl-row-t">{m.nome}</div>
                  <div className="dl-row-s">
                    {pronta ? "alcançada" : "faltam " + brl(alvo - at)} · {brl(at)} de {brl(alvo)}
                    {m.prazo ? " · até " + br(m.prazo) : ""}
                  </div>
                </div>
                <button className="dl-x" onClick={() => up({ metas: d.metas.filter((y) => y.id !== m.id) })}>×</button>
              </div>
              <div className="dl-prog"><i style={{ width: pct + "%", background: pronta ? "var(--terra)" : "var(--cobre)" }} /></div>
              {m.fonte === "manual" && (
                <input className="dl-in" style={{ marginTop: 8 }} inputMode="decimal" placeholder="onde estou hoje R$"
                  value={m.atual} onChange={(e) => edit(m.id, { atual: e.target.value })} />
              )}
            </div>
            <div className="dl-cond">
              {subs.map((s) => (
                <label className="dl-cond-row" key={s.id} style={{ cursor: "pointer" }}>
                  <input type="checkbox" checked={!!s.ok} style={{ marginTop: 4 }}
                    onChange={() => edit(m.id, { submetas: subs.map((y) => (y.id === s.id ? { ...y, ok: !y.ok } : y)) })} />
                  <span style={{ flex: 1, textDecoration: s.ok ? "line-through" : "none", color: s.ok ? "var(--muted)" : undefined }}>{s.t}</span>
                  <button className="dl-x" onClick={() => edit(m.id, { submetas: subs.filter((y) => y.id !== s.id) })}>×</button>
                </label>
              ))}
              <div className="dl-f" style={{ marginTop: 6, marginBottom: 0 }}>
                <input className="dl-in" placeholder="Nova submeta" value={sub} onChange={(e) => setSub(e.target.value)} />
                <button className="dl-btn-2" onClick={() => { if (!sub.trim()) return; edit(m.id, { submetas: [...subs, { id: uid(), t: sub.trim(), ok: false }] }); setSub(""); }}>+</button>
              </div>
            </div>
          </div>
        );

      <div className="dl-grid" style={{ marginTop: 0, marginBottom: 10 }}>
        <div className="dl-stat"><p className="dl-stat-label">1 · Reserva</p><div className="dl-stat-val">{brl(num(d.reserva))}</div><p className="dl-row-s">{c.reservaMeses.toFixed(1)} de 6 meses</p></div>
        <div className="dl-stat"><p className="dl-stat-label">2 · Capital de giro</p><div className="dl-stat-val">{brl(num(d.giro))}</div></div>
        <div className="dl-stat"><p className="dl-stat-label">3 · Fundo de ativos</p><div className="dl-stat-val" style={{ color: bloqueado ? "var(--muted)" : "var(--cobre)" }}>{brl(num(d.fundoAtivos))}</div><p className="dl-row-s">{bloqueado ? "travado" : "liberado"}</p></div>
        <div className="dl-stat">
          <p className="dl-stat-label">Percentuais</p>
          <div className="dl-f" style={{ marginTop: 4, marginBottom: 0 }}>
            {["reserva", "giro", "ativos"].map((k) => (
              <input key={k} className="dl-in" inputMode="numeric" value={p[k]} style={{ padding: "5px 6px", textAlign: "center" }}
                onChange={(e) => up({ potes: { ...p, [k]: +e.target.value || 0 } })} />
            ))}
          </div>
        </div>
      </div>
      <div className="dl-form">
        <div className="dl-f">
          <input className="dl-in" inputMode="decimal" placeholder="Lucro do mês R$" value={lucro} onChange={(e) => setLucro(e.target.value)} />
          <button className="dl-btn" onClick={distribuir}>Distribuir</button>
        </div>
      </div>

      <h3 style={{ marginTop: 18, marginBottom: 8 }}>Marcos que você confirma na mão</h3>
      {[["margens", "Já apurei a margem por tipo de obra dos últimos 12 meses"],
        ["operacao60", "A operação rodou 60 dias seguidos sem mim no canteiro"],
        ["lucro6", "Tive lucro em 6 meses seguidos"],
        ["primeiroAtivo6", "Meu primeiro ativo se paga sozinho há 6 meses"]].map(([k, t]) => (
        <label className="dl-chk" key={k}>
          <input type="checkbox" checked={!!d.marcos[k]} onChange={(e) => up({ marcos: { ...d.marcos, [k]: e.target.checked } })} />

        <p className="dl-stat-label" style={{ marginBottom: 6 }}>Ciclo de caixa: dias entre o primeiro gasto e o último recebimento</p>

      </div>
    </div>
  );
